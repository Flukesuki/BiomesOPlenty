name: BiomesOPlenty

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: 8
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload JAR as artifact
      uses: actions/upload-artifact@v3
      with:
        name: BiomesOPlenty
        path: build/libs/*.jar